<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кошик — Ощадний Кошик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EBE7DB; --card: #FFFDF7; --ink: #23271F; --ink-soft: #565A4E;
    --red: #C8462E; --red-deep: #A73A26; --green: #33604A; --green-deep: #244A39;
    --line: rgba(35, 39, 31, 0.14); --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'Manrope', system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 28px; }

  header { padding: 22px 0; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1180px; margin: 0 auto; padding: 0 28px; }
  .logo { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.35rem; display: flex; align-items: center; gap: 10px; }
  .logo-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--green); color: var(--card); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transform: rotate(-6deg); }
  nav a { color: var(--ink-soft); font-weight: 600; font-size: 0.94rem; }
  nav a:hover { color: var(--ink); }

  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(1.7rem, 3vw, 2.2rem); letter-spacing: -0.01em; padding: 20px 0 30px; }

  .cart-items { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
  .cart-item { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; align-items: center; gap: 16px; }
  .item-name { flex: 1; font-weight: 600; font-size: 0.94rem; }
  .item-sku { font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; color: var(--ink-soft); display: block; margin-top: 4px; font-weight: 400; }
  .item-qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 100px; }
  .item-qty button { width: 30px; height: 30px; border: none; background: none; cursor: pointer; font-size: 1rem; }
  .item-qty input { width: 36px; text-align: center; border: none; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 0.88rem; }
  .item-price { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--red-deep); min-width: 90px; text-align: right; }
  .item-remove { color: var(--ink-soft); font-size: 0.8rem; cursor: pointer; background: none; border: none; text-decoration: underline; }

  .empty-cart { text-align: center; padding: 70px 20px; color: var(--ink-soft); }
  .empty-cart a { color: var(--green-deep); font-weight: 700; text-decoration: underline; }

  .summary { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 24px; margin-bottom: 30px; }
  .summary-row { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 1.1rem; font-weight: 700; }

  .checkout-form { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 28px; margin-bottom: 60px; }
  .checkout-form h2 { font-family: 'Fraunces', serif; font-size: 1.2rem; margin-bottom: 20px; }
  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--paper); font-family: 'Manrope', sans-serif; font-size: 0.92rem; color: var(--ink);
  }
  .form-row textarea { resize: vertical; min-height: 70px; }
  .submit-btn { width: 100%; background: var(--ink); color: var(--card); font-weight: 700; font-size: 1rem; padding: 15px; border-radius: 100px; border: none; cursor: pointer; margin-top: 8px; }
  .submit-btn:hover { background: var(--green-deep); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .form-status { margin-top: 14px; font-size: 0.88rem; font-weight: 600; }
  .form-status.success { color: var(--green-deep); }
  .form-status.error { color: var(--red-deep); }

  .delivery-note { font-size: 0.8rem; color: var(--ink-soft); margin-top: -6px; margin-bottom: 16px; }
  .summary-delivery { display: flex; justify-content: space-between; font-size: 0.86rem; color: var(--ink-soft); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }

  @media (max-width: 620px) {
    .cart-item { flex-wrap: wrap; }
    .item-price { text-align: left; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <a class="logo" href="/">
      <span class="logo-mark">К</span>
      Ощадний Кошик
    </a>
    <nav><a href="/#categories">← До каталогу</a></nav>
  </div>
</header>

<div class="wrap">
  <h1>Ваш кошик</h1>

  <div id="cartItems" class="cart-items"></div>

  <div id="summarySection" hidden>
    <div class="summary">
      <div class="summary-row"><span>Разом за товари</span><span id="cartTotal">0.00 ₴</span></div>
      <div class="summary-delivery"><span>Доставка</span><span>За тарифами перевізника, оплата при отриманні</span></div>
    </div>

    <form class="checkout-form" id="checkoutForm">
      <h2>Оформлення замовлення</h2>

      <div class="form-row">
        <label for="customerName">Ім'я</label>
        <input type="text" id="customerName" required>
      </div>

      <div class="form-row">
        <label for="customerPhone">Телефон</label>
        <input type="tel" id="customerPhone" required placeholder="+380...">
      </div>

      <div class="form-row">
        <label for="deliveryMethod">Спосіб отримання</label>
        <select id="deliveryMethod">
          <option value="pickup">Самовивіз</option>
          <option value="nova_poshta">Нова Пошта</option>
        </select>
      </div>

      <div id="pickupNote" class="delivery-note">Забрати можна за адресою: вул. Ковельська, 253, м. Володимир.</div>

      <div id="novaPoshtaFields" hidden>
        <div class="form-row">
          <label for="npCity">Місто</label>
          <input type="text" id="npCity" placeholder="Наприклад, Луцьк">
        </div>
        <div class="form-row">
          <label for="npBranch">Номер відділення або адреса поштомату</label>
          <input type="text" id="npBranch" placeholder="Наприклад, відділення №5">
        </div>
      </div>

      <div class="form-row">
        <label for="customerNote">Коментар до замовлення</label>
        <textarea id="customerNote" placeholder="Необов'язково"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Підтвердити замовлення</button>
      <div id="formStatus" class="form-status"></div>
    </form>
  </div>
</div>

<script src="/cart.js"></script>
<script>
(function () {
  var itemsEl = document.getElementById("cartItems");
  var summarySection = document.getElementById("summarySection");
  var totalEl = document.getElementById("cartTotal");

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    var items = window.KoshykCart.getCart();
    if (!items.length) {
      itemsEl.innerHTML = '<div class="empty-cart">Кошик порожній. <a href="/#categories">Перейти до каталогу →</a></div>';
      summarySection.hidden = true;
      return;
    }

    itemsEl.innerHTML = items.map(function (item) {
      return '' +
        '<div class="cart-item" data-id="' + item.id + '">' +
          '<div class="item-name">' + escapeHtml(item.name) + '<span class="item-sku">' + escapeHtml(item.sku) + '</span></div>' +
          '<div class="item-qty">' +
            '<button type="button" class="qty-minus">−</button>' +
            '<input type="number" class="qty-input" value="' + item.qty + '" min="1">' +
            '<button type="button" class="qty-plus">+</button>' +
          '</div>' +
          '<div class="item-price">' + (item.price * item.qty).toFixed(2) + ' ₴</div>' +
          '<button type="button" class="item-remove">Прибрати</button>' +
        '</div>';
    }).join("");

    totalEl.textContent = window.KoshykCart.cartTotal().toFixed(2) + " ₴";
    summarySection.hidden = false;

    itemsEl.querySelectorAll(".cart-item").forEach(function (row) {
      var id = parseInt(row.dataset.id, 10);
      row.querySelector(".qty-minus").addEventListener("click", function () {
        var input = row.querySelector(".qty-input");
        var qty = Math.max(1, parseInt(input.value, 10) - 1);
        window.KoshykCart.updateQty(id, qty);
        render();
      });
      row.querySelector(".qty-plus").addEventListener("click", function () {
        var input = row.querySelector(".qty-input");
        var qty = parseInt(input.value, 10) + 1;
        window.KoshykCart.updateQty(id, qty);
        render();
      });
      row.querySelector(".qty-input").addEventListener("change", function (e) {
        var qty = Math.max(1, parseInt(e.target.value, 10) || 1);
        window.KoshykCart.updateQty(id, qty);
        render();
      });
      row.querySelector(".item-remove").addEventListener("click", function () {
        window.KoshykCart.removeFromCart(id);
        render();
      });
    });
  }

  var deliverySelect = document.getElementById("deliveryMethod");
  var pickupNote = document.getElementById("pickupNote");
  var npFields = document.getElementById("novaPoshtaFields");
  var npCity = document.getElementById("npCity");
  var npBranch = document.getElementById("npBranch");

  function toggleDeliveryFields() {
    var isNP = deliverySelect.value === "nova_poshta";
    npFields.hidden = !isNP;
    pickupNote.hidden = isNP;
    npCity.required = isNP;
    npBranch.required = isNP;
  }
  deliverySelect.addEventListener("change", toggleDeliveryFields);
  toggleDeliveryFields();

  document.getElementById("checkoutForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var submitBtn = document.getElementById("submitBtn");
    var statusEl = document.getElementById("formStatus");
    submitBtn.disabled = true;
    statusEl.textContent = "";
    statusEl.className = "form-status";

    var deliveryMethod = deliverySelect.value;
    var note = document.getElementById("customerNote").value;

    // Місто/відділення додаємо в коментар до замовлення, щоб адреса
    // доставки гарантовано доходила навіть якщо API замовлення ще
    // не приймає окремі поля npCity/npBranch.
    if (deliveryMethod === "nova_poshta") {
      var addressLine = "Нова Пошта: " + npCity.value.trim() + ", " + npBranch.value.trim();
      note = note ? addressLine + "\n" + note : addressLine;
    }

    var payload = {
      customerName: document.getElementById("customerName").value,
      customerPhone: document.getElementById("customerPhone").value,
      deliveryMethod: deliveryMethod,
      npCity: deliveryMethod === "nova_poshta" ? npCity.value.trim() : null,
      npBranch: deliveryMethod === "nova_poshta" ? npBranch.value.trim() : null,
      customerNote: note,
      items: window.KoshykCart.getCart().map(function (i) {
        return { id: i.id, qty: i.qty };
      }),
    };

    fetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          statusEl.textContent = "Замовлення №" + data.orderNumber + " прийнято! Ми зв'яжемось з вами найближчим часом.";
          statusEl.className = "form-status success";
          window.KoshykCart.clearCart();
          render();
          document.getElementById("checkoutForm").reset();
          toggleDeliveryFields();
        } else {
          statusEl.textContent = data.error || "Сталася помилка. Спробуйте ще раз.";
          statusEl.className = "form-status error";
        }
      })
      .catch(function () {
        statusEl.textContent = "Не вдалося надіслати замовлення. Перевірте з'єднання.";
        statusEl.className = "form-status error";
      })
      .finally(function () {
        submitBtn.disabled = false;
      });
  });

  render();
})();
</script>

</body>
</html>
